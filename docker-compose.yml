services:
  db:
    image: postgres:16-alpine
    container_name: health_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: health_dashboard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: healthdb
      DB_USER: postgres
      DB_PASSWORD: postgres123
    # Mount host metrics path if you want host hardware stats instead of container-scoped stats
    pid: "host"

volumes:
  postgres_data: